# Render Blueprint: Render dashboard > New > Blueprint > ye repository chunein.
# Free web service banata hai. Deploy ke waqt Render DATABASE_URL poochega:
# wahan Neon (ya kisi bhi PostgreSQL) ka connection string paste karein.
services:
  - type: web
    name: news-site
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: DATABASE_URL
        sync: false
